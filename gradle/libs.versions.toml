[versions]
agp = "8.7.2"
googleServices = "4.4.2"
kotlin = "2.0.21"
compileSdk = "35"
minSdk = "26"
targetSdk = "35"
ksp = "2.0.21-1.0.28"
room = "2.6.1"
coroutines = "1.8.1"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
androidxTestUiautomator = "2.3.0"
firebaseBom = "33.6.0"
kotlinxSerializationJson = "1.7.1"
junit = "4.13.2"
androidxCoreKtx = "1.13.1"
# Visual design screen 1: backports the Android 12 splash-screen API down to this project's
# minSdk 26, so the system's pre-Compose launch window is brand-themed on every supported device
# rather than only on API 31+.
androidxCoreSplashscreen = "1.0.1"
androidxActivityKtx = "1.9.3"
composeBom = "2025.09.00" # Step 45: bumped from 2024.10.01 specifically to get ui-test-junit4-accessibility (real Google Accessibility Test Framework integration, needs Compose UI 1.8.0+). Verified this exact version still compiles clean against this project's existing AGP 8.7.2/compileSdk 35 — the newest BOM (2026.08.00) requires AGP 9.1+/compileSdk 37, a much bigger jump, so this is the newest one that doesn't force that.
androidxActivityCompose = "1.9.3"
androidxLifecycleRuntimeKtx = "2.8.7"
androidxNavigationCompose = "2.8.3"
playServicesLocation = "21.3.0"
revenueCatPurchases = "10.15.1"
# Real "Continue with Google" (ACCOUNT_ACTIONS_NEEDED.md item 6): Credential Manager is the current,
# non-deprecated way to get a Google ID token on Android, replacing the old GoogleSignInClient API.
androidxCredentials = "1.3.0"
googleid = "1.1.1"
# LigayaMascot (design-system) hosts the Gemini mascot rig in a WebView; WebViewAssetLoader needs this.
webkit = "1.17.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }

